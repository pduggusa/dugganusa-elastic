# DugganUSA STIX Feed — Filebeat HTTP JSON Input
# Polls the STIX feed and indexes indicators into Elasticsearch.
#
# Polling budget: every request (feed, CSV, Tor) counts against your key's daily
# limit. The FREE key is 10 requests/day, so the defaults below total 7/day
# (STIX every 6h = 4, each CSV and Tor daily = 3). On a paid key you can drop
# the intervals to 1h. Hourly polling of all inputs (73/day) exhausts a free key
# by the fourth hour, and every later poll fails with HTTP 429.
#
# Usage:
#   filebeat -e -c filebeat-dugganusa.yml
#
# Environment:
#   DUGGANUSA_API_KEY — REQUIRED. The feed rejects anonymous requests
#   (401). Register a free key: https://analytics.dugganusa.com/stix/register

filebeat.inputs:
  - type: httpjson
    enabled: true
    interval: 6h
    request.url: "https://analytics.dugganusa.com/api/v1/stix-feed"
    request.method: GET
    request.headers:
      Accept: "application/json"
      # REQUIRED — the feed rejects anonymous requests (401).
      # Register a free key: https://analytics.dugganusa.com/stix/register
      Authorization: "Bearer ${DUGGANUSA_API_KEY}"
    response.split:
      target: body.objects
      type: array
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
      - add_fields:
          target: threat
          fields:
            feed.name: "DugganUSA"
            indicator.provider: "DugganUSA LLC"

  # IP blocklist (CSV)
  - type: httpjson
    enabled: true
    interval: 24h
    request.url: "https://analytics.dugganusa.com/api/v1/stix-feed/ips.csv"
    request.method: GET
    request.headers:
      Authorization: "Bearer ${DUGGANUSA_API_KEY}"   # required; read from the environment
    # The body is CSV, not JSON. Without decode_as httpjson fails to parse it and indexes nothing.
    # Columns: ip,confidence,threat_type,source,first_seen (one event per row).
    response.decode_as: text/csv
    processors:
      - add_fields:
          target: threat
          fields:
            feed.name: "DugganUSA-IPs"
            indicator.type: "ipv4-addr"

  # Domain blocklist (CSV)
  - type: httpjson
    enabled: true
    interval: 24h
    request.url: "https://analytics.dugganusa.com/api/v1/stix-feed/domains.csv"
    request.method: GET
    request.headers:
      Authorization: "Bearer ${DUGGANUSA_API_KEY}"   # required; read from the environment
    # Columns: domain,confidence,threat_type,source,first_seen
    response.decode_as: text/csv
    processors:
      - add_fields:
          target: threat
          fields:
            feed.name: "DugganUSA-Domains"
            indicator.type: "domain-name"

  # Tor relay data (daily consensus)
  - type: httpjson
    enabled: true
    interval: 24h
    request.url: "https://analytics.dugganusa.com/api/v1/tor/relays?isExit=true&limit=500"
    request.method: GET
    request.headers:
      Accept: "application/json"
      # Required: /tor/relays rejects anonymous requests (401).
      Authorization: "Bearer ${DUGGANUSA_API_KEY}"
    response.split:
      # The response is { data: { hits: [...] } }; there is no data.relays.
      target: body.data.hits
      type: array
    processors:
      - add_fields:
          target: tor
          fields:
            feed.name: "DugganUSA-TorRelays"
      - add_fields:
          target: threat
          fields:
            feed.name: "DugganUSA-TorRelays"
            indicator.type: "tor-relay"

output.elasticsearch:
  hosts: ["localhost:9200"]
  index: "dugganusa-threat-intel-%{+yyyy.MM.dd}"
  # Uncomment for authentication:
  # username: "elastic"
  # password: "changeme"

setup.template:
  name: "dugganusa-threat-intel"
  pattern: "dugganusa-threat-intel-*"

setup.ilm:
  enabled: true
  rollover_alias: "dugganusa-threat-intel"
  pattern: "{now/d}-000001"
  policy_name: "dugganusa-threat-intel-policy"
