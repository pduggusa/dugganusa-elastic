# DugganUSA — Feed-Efficacy Hit Reporting (Logstash)
# =====================================================================
# Reports back to /api/v1/feed/hit when one of OUR published indicators
# matches YOUR traffic. This closes the LIVENESS validation axis
# (https://analytics.dugganusa.com/api/v1/feed-efficacy): proof that the
# indicators we publish actually fire in the wild — not just that the feed
# is large.
#
# PRIVACY CONTRACT (load-bearing): this pipeline sends ONLY the matched
# indicator (our published threat infra) plus action/direction/count/ts.
# It NEVER sends your source IP, host, user, asset, URL path, or the raw
# event. The explicit `mapping` in the http output below is the privacy
# boundary — nothing outside it leaves your network. (The platform also
# drops any victim-side field server-side and reports it back as `stripped`.)
#
# PREREQUISITE: a matching event must carry two fields by the time it
# reaches this output:
#   [dugganusa_match]      => true
#   [dugganusa_indicator]  => "<the indicator value that matched>"
# The `translate` filter below shows one way to set them, using the IP
# blocklist you already sync from
#   https://analytics.dugganusa.com/api/v1/stix-feed/ips.csv
# Adapt the `source` field ([destination][ip]) to your own schema, or set
# the two fields yourself in your existing pipeline and keep only the
# output { } block.

filter {
  # --- Example matcher: flag events whose destination IP is on our list ---
  # ips.csv is "ip,<meta...>"; translate keys on column 1. Non-matches get
  # the literal "false" via `fallback`.
  translate {
    source          => "[destination][ip]"
    target          => "[dugganusa_match]"
    dictionary_path => "/etc/logstash/dugganusa/dugganusa_ip_blocklist.csv"
    refresh_interval => 3600
    fallback        => "false"
    override        => true
  }

  if [dugganusa_match] and [dugganusa_match] != "false" {
    mutate { add_field => { "[dugganusa_indicator]" => "%{[destination][ip]}" } }
  } else {
    mutate { remove_field => ["dugganusa_match"] }
  }
}

output {
  # Only matched events with an indicator reach the reporting endpoint.
  if [dugganusa_indicator] {
    http {
      url          => "https://analytics.dugganusa.com/api/v1/feed/hit"
      http_method  => "post"
      format       => "json"
      content_type => "application/json"
      # REQUIRED — hits must be attributable. Use your registered feed key.
      # Register free: https://analytics.dugganusa.com/stix/register
      headers      => { "Authorization" => "Bearer dugusa_YOUR_KEY_HERE" }
      # Explicit mapping = the privacy boundary. ONLY these fields are sent.
      mapping      => {
        "consumer_kind" => "elastic"
        "hits" => [
          {
            "indicator" => "%{[dugganusa_indicator]}"
            "action"    => "alerted"
            "direction" => "inbound"
            "count"     => 1
          }
        ]
      }
      # Reporting is best-effort; don't wedge the pipeline on transient errors.
      pool_max          => 10
      retry_failed      => false
      automatic_retries => 1
    }
  }
}
